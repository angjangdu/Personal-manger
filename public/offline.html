<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Personal OS</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background:#0a0a0a; color:#ededed; font-family:system-ui,sans-serif; text-align:center; }
    .bolt { width:64px; height:64px; margin:0 auto 16px; border-radius:16px;
      background:linear-gradient(135deg,#6366f1,#4f46e5); display:grid; place-items:center; font-size:32px; }
    h1 { font-size:18px; margin:0 0 8px; }
    p { color:#a1a1aa; font-size:14px; margin:0 0 20px; }
    button { background:#6366f1; color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer; }
  </style>
</head>
<body>
  <div>
    <div class="bolt">⚡</div>
    <h1>You're offline</h1>
    <p>Reconnect to load this page.<br/>Your data is safe on this device.</p>
    <button onclick="location.href='/dashboard'">Go to dashboard</button>
  </div>
</body>
</html>
